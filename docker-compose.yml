services:
  wheel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      REDEEM_HINT: ${REDEEM_HINT:-}
      # true за HTTPS (обязательно для SameSite=None при кросс-доменных запросах)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://sainep.pro}
      MANAGER_LOGIN: ${MANAGER_LOGIN:-manager}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      TZ_OFFSET_HOURS: ${TZ_OFFSET_HOURS:-7}
    volumes:
      - wheel_data:/app/data
      - wheel_uploads:/app/uploads
    restart: unless-stopped

volumes:
  wheel_data:
  wheel_uploads:
