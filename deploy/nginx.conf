# /etc/nginx/sites-available/wheel  (symlink to sites-enabled/)
#
# Reverse-proxy для wheel-second:
#   /        -> рулетка (index.html через бэкенд)
#   /admin   -> админка (admin.html)
#   /api/    -> Express API
#   /uploads/-> картинки призов
#
# Приложение слушает на 127.0.0.1:3000 (см. docker-compose.yml).

upstream wheel_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Загрузка картинок призов — до 8 MiB (см. multer limits).
    client_max_body_size 10m;

    # Логи отдельно от nginx-дефолтов — удобнее отлаживать.
    access_log /var/log/nginx/wheel.access.log;
    error_log  /var/log/nginx/wheel.error.log;

    # Короткий путь /admin -> admin.html.
    # Точное совпадение, поэтому /administrator или /admin/... сюда не попадут.
    location = /admin {
        proxy_pass http://wheel_backend/admin.html;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://wheel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
